name: ERupee
options:
  bundleIdPrefix: com.erupee
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
targets:
  ERupee:
    type: application
    platform: iOS
    sources:
      - ERupee
    settings:
      base:
        INFOPLIST_FILE: ERupee/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.erupee.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: false
